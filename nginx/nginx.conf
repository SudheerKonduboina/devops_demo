# ════════════════════════════════════════════════════════════════
# InfraWatch — Nginx Reverse Proxy Configuration
# ════════════════════════════════════════════════════════════════
#
# What Nginx does here:
#  1. Listens on port 80 (public internet)
#  2. Forwards requests to Flask app on port 5000 (internal)
#  3. Adds security headers
#  4. Enables gzip compression
#  5. Applies rate limiting (10 req/s per IP)
#  6. Logs all access/errors
#
# Why Nginx instead of serving Flask directly?
#  - Flask/Gunicorn is NOT designed to face the internet directly
#  - Nginx handles static files, SSL termination, and abuse protection
#  - Standard production pattern for Python web apps
# ════════════════════════════════════════════════════════════════

worker_processes auto;                   # Auto-detect CPU cores
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;             # Max simultaneous connections
    use epoll;                           # Linux-optimized event model
    multi_accept on;                     # Accept multiple connections per wake
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Access Log Format ──────────────────────────────────────────────────
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance Tuning ─────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    server_tokens off;                   # Hide Nginx version (security)

    # ── Gzip Compression ──────────────────────────────────────────────────
    # Reduces response size → faster API responses for clients
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml;

    # ── Rate Limiting ─────────────────────────────────────────────────────
    # Protect against brute-force and DDoS attacks
    # Zone: 10MB memory = ~160,000 unique IPs tracked
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_status 429;

    # ── Upstream Flask Application ─────────────────────────────────────────
    # "app" resolves to the Docker container named "app" on the same network
    upstream infrawatch_backend {
        server app:5000;
        keepalive 32;                    # Reuse connections to upstream
    }

    # ── Virtual Server ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;                   # Accept any hostname

        # ── Security Headers ─────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Request-ID $request_id always;

        # ── Main API Proxy ───────────────────────────────────────────────
        location / {
            # Apply rate limiting: burst of 20 allowed before rejecting
            limit_req zone=api_zone burst=20 nodelay;

            proxy_pass http://infrawatch_backend;

            # Pass real client info to Flask
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Enable keep-alive to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Health Check (no rate limiting — used by load balancers) ─────
        location = /healthz {
            proxy_pass http://infrawatch_backend;
            proxy_set_header Host $host;
            access_log off;              # Don't fill logs with health checks
        }

        location = /readyz {
            proxy_pass http://infrawatch_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── Nginx Built-in Status (internal monitoring only) ─────────────
        location = /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;        # Docker networks
            deny all;
        }
    }
}
