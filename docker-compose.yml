# ════════════════════════════════════════════════════════════════
# InfraWatch — Docker Compose v3.9
# ════════════════════════════════════════════════════════════════
#
# Services:
#   app   — Flask + Gunicorn API (port 5000, internal only)
#   nginx — Nginx reverse proxy  (port 80, public-facing)
#
# Volumes:
#   app_logs   — persistent application log files
#   nginx_logs — persistent Nginx access/error logs
#
# Networks:
#   infrawatch-net — isolated bridge network (app ↔ nginx)
#
# Why Docker Compose?
#   Manages multi-container apps with a single file.
#   One command (docker compose up -d) starts everything.
# ════════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ──────────────────────────────────────────────────────────────
  # Flask Application Service
  # ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infrawatch-app
    restart: unless-stopped            # Auto-restart on crash, not on manual stop

    # Load .env file for secrets/config (never hardcode these!)
    env_file:
      - .env
    environment:
      - APP_NAME=InfraWatch
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - PORT=5000
      - LOG_FILE=/app/logs/infrawatch.log

    # Persistent storage for application logs
    volumes:
      - app_logs:/app/logs

    # Attach to the internal network
    networks:
      - infrawatch-net

    # Internal port only — NOT exposed to host (Nginx handles traffic)
    expose:
      - "5000"

    # Docker-native health check (also defined in Dockerfile)
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:5000/healthz', timeout=5); sys.exit(0 if r.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ──────────────────────────────────────────────────────────────
  # Nginx Reverse Proxy Service
  # ──────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine          # Alpine = smallest official Nginx image
    container_name: infrawatch-nginx
    restart: unless-stopped

    # Map host port 80 → container port 80
    ports:
      - "80:80"

    # Mount our custom nginx.conf (read-only for security)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx

    networks:
      - infrawatch-net

    # Nginx only starts AFTER the app passes its health check
    depends_on:
      app:
        condition: service_healthy


# ════════════════════════════════════════════════════════════════
# Named Volumes (data persists across container restarts)
# ════════════════════════════════════════════════════════════════
volumes:
  app_logs:
    name: infrawatch_app_logs
  nginx_logs:
    name: infrawatch_nginx_logs


# ════════════════════════════════════════════════════════════════
# Networks (isolated bridge — containers can reach each other
# by service name e.g. http://app:5000 but not the outside world)
# ════════════════════════════════════════════════════════════════
networks:
  infrawatch-net:
    name: infrawatch_network
    driver: bridge
